<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio — Sales Page v1</title>
<style>
:root{--bg:#f4f1ea;--ink:#141414;--card:#e6e1d6;--accent:hsl(265 80% 60%);--radius:24px;--glow:60vmin;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#f2efe8;--card:#242424}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh;overflow-x:hidden}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;letter-spacing:-.03em;font-size:1.3rem}
nav ul{display:flex;gap:clamp(14px,3vw,40px);list-style:none;padding:0}
nav a{color:var(--ink);text-decoration:none;font-weight:700;text-transform:uppercase;font-size:.9rem;display:block;height:1.2em;line-height:1.2;overflow:hidden}
nav a span{display:block;transition:transform .5s cubic-bezier(.7,0,.2,1)}
nav a span+span{color:var(--accent)}
nav a:hover span{transform:translateY(-100%)}
main section{display:none;padding:6vh 5vw}
main section.on{display:block}
.hero{min-height:56vh;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:900px}
.hero h1{font-size:clamp(2.6rem,9vw,7rem);line-height:.95;letter-spacing:-.04em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:1.15rem;max-width:520px;line-height:1.5}
.btn{align-self:flex-start;border:2px solid var(--ink);background:none;color:var(--ink);font:700 1rem inherit;font-family:inherit;padding:14px 22px;border-radius:999px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:background .4s,color .4s}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.arrow{display:inline-block;font-size:1.4rem;transform-style:preserve-3d}
.gh{display:flex;justify-content:space-between;align-items:center;margin:8vh 0 20px}
.gh h2{font-size:1.6rem;letter-spacing:-.02em}
#spin{width:90px;height:90px;overflow:visible}
#spin polygon{fill:var(--accent);transition:fill .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.tile{aspect-ratio:4/5;border-radius:var(--radius);background:var(--card);cursor:pointer;display:grid;place-items:center;font-weight:700;opacity:.95}
.ov{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
.ov.on{display:grid}
.blob{position:absolute;width:var(--glow);height:var(--glow);background:radial-gradient(circle,var(--accent),transparent 68%);filter:blur(40px);opacity:.7;animation:morph 6s ease-in-out infinite alternate;border-radius:50%}
@keyframes morph{to{border-radius:38% 62% 55% 45%/55% 40% 60% 45%;transform:rotate(40deg) scale(1.1)}}
.big,.sat{position:absolute;border-radius:var(--radius);background:var(--card);display:grid;place-items:center;font-weight:700;border:2px solid var(--ink)}
.big{width:min(46vmin,320px);aspect-ratio:4/5}
.sat{width:min(16vmin,110px);aspect-ratio:1}
#tw{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:.8rem;max-width:260px}
#tw summary{cursor:pointer;font-weight:700}
#tw label{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:8px;align-items:center}
#tw select,#tw button{font:inherit;margin-top:8px}
</style></head><body>
<nav><div class="logo">STUDIO</div>
<ul id="links"></ul></nav>
<main>
<section id="home" class="on">
 <div class="hero"><h1 id="ht"></h1><p id="hp"></p>
 <button class="btn" id="hb"><span id="hbt"></span><span class="arrow" id="ar">→</span></button></div>
 <div class="gh"><h2>Selected work</h2>
 <svg id="spin" viewBox="-60 -60 120 120"><polygon id="poly"/></svg></div>
 <div class="grid" id="grid"></div>
</section>
<section id="work"><h1>Work</h1></section>
<section id="about"><h1>About</h1></section>
<section id="services"><h1>Services</h1></section>
<section id="contact"><h1>Contact</h1></section>
</main>
<div class="ov" id="ov"><div class="blob"></div></div>
<details id="tw"><summary>Tweaks</summary>
<label>Roundness <input type="range" id="c_r" min="0" max="60" value="24"></label>
<label>Glow size <input type="range" id="c_g" min="30" max="90" value="60"></label>
<label>Accent hue <input type="range" id="c_h" min="0" max="360" value="265"></label>
<label>Color drift <input type="range" id="c_d" min="0" max="120" value="30"></label>
<label>Drift speed <input type="range" id="c_s" min="2" max="30" value="12"></label>
<label>Tile stagger <input type="range" id="c_t" min="0" max="20" value="8"></label>
<select id="c_st"><option value="0">Graphic</option><option value="1">Product</option><option value="2">Industrial</option></select>
<button id="replay">Replay gallery intro</button></details>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ===== CONFIG: edit these to change the site =====
const CONFIG={
 pages:["home","work","about","services","contact"],
 states:[
  {t:"Graphic <em>design</em>",p:"Identity, type and illustration with a goofy but restrained edge.",b:"See graphic work"},
  {t:"Product <em>design</em>",p:"Objects that feel considered, from sketch to shelf.",b:"See product work"},
  {t:"Industrial <em>design</em>",p:"Form, function and manufacturing, kept simple.",b:"See industrial work"}],
 tiles:6, hue:265, drift:30, driftSpeed:12, stagger:.08, spinEvery:2.2
};
const $=s=>document.querySelector(s), root=document.documentElement;
// nav
$("#links").innerHTML=CONFIG.pages.map(p=>`<li><a href="#${p}"><span>${p}</span><span>${p}</span></a></li>`).join("");
// pages (hash routing)
function route(){const h=location.hash.slice(1)||"home";document.querySelectorAll("main section").forEach(s=>s.classList.toggle("on",s.id===h));scrollTo(0,0)}
addEventListener("hashchange",route);route();
// header states
let st=0;
function setText(i){const s=CONFIG.states[i];$("#ht").innerHTML=s.t;$("#hp").textContent=s.p;$("#hbt").textContent=s.b}
function goState(i,flip=true){
 const tl=gsap.timeline();
 if(flip)tl.to("#ar",{rotationX:"+=360",duration:.7,ease:"power2.inOut",transformPerspective:300},0);
 tl.to(["#ht","#hp","#hb"],{y:-20,opacity:0,duration:.25,stagger:.05},0)
  .add(()=>{st=i;setText(i);$("#c_st").value=i})
  .fromTo(["#ht","#hp","#hb"],{y:20,opacity:0},{y:0,opacity:1,duration:.45,stagger:.08,ease:"back.out(1.6)"});
}
setText(0);
$("#hb").onclick=()=>goState((st+1)%CONFIG.states.length);
$("#c_st").onchange=e=>goState(+e.target.value,false);
// gallery
$("#grid").innerHTML=Array.from({length:CONFIG.tiles},(_,i)=>`<div class="tile" data-i="${i}" style="background:hsl(${(i*40+30)} 30% 70%/.5)">Project ${i+1}</div>`).join("");
const intro=()=>gsap.fromTo(".tile",{y:60,opacity:0},{y:0,opacity:.95,duration:.7,stagger:CONFIG.stagger,ease:"back.out(1.4)"});
intro();$("#replay").onclick=intro;
const ov=$("#ov");let items=[];
function openTile(i){
 ov.classList.add("on");
 items.forEach(e=>e.remove());items=[];
 const big=document.createElement("div");big.className="big";big.textContent="Project "+(+i+1);
 ov.append(big);items.push(big);
 const n=5,r=Math.min(innerWidth,innerHeight)*.34;
 for(let k=0;k<n;k++){const s=document.createElement("div");s.className="sat";s.textContent="+";ov.append(s);items.push(s);
  const a=(k/n)*Math.PI*2-Math.PI/2;
  gsap.fromTo(s,{x:0,y:0,scale:0,opacity:0},{x:Math.cos(a)*r*1.25,y:Math.sin(a)*r*1.1,scale:1,opacity:1,duration:.8,delay:.15+k*.07,ease:"back.out(2)"});}
 gsap.fromTo(big,{scale:.6,opacity:0},{scale:1,opacity:1,duration:.5,ease:"back.out(1.5)"});
 gsap.fromTo(".blob",{scale:.2,opacity:0},{scale:1,opacity:.7,duration:.9,ease:"power3.out"});
}
function closeOv(){gsap.to(ov,{opacity:0,duration:.25,onComplete:()=>{ov.classList.remove("on");gsap.set(ov,{opacity:1})}})}
$("#grid").onclick=e=>{const t=e.target.closest(".tile");if(t)openTile(t.dataset.i)};
ov.onclick=closeOv;addEventListener("keydown",e=>e.key==="Escape"&&closeOv());
// spinner from primitives
const P={t:0,rot:0,n:8};
function draw(){const pts=[];for(let i=0;i<P.n*2;i++){const r=i%2?50*(1-.55*P.t):50;const a=(i/(P.n*2))*Math.PI*2+P.rot;pts.push((Math.cos(a)*r).toFixed(1)+","+(Math.sin(a)*r).toFixed(1))}$("#poly").setAttribute("points",pts.join(" "))}
gsap.ticker.add(()=>{P.rot+=.012;draw()});
(function shift(){const ns=[3,4,5,6,8];P.n=ns[Math.floor(Math.random()*ns.length)];gsap.to(P,{t:Math.random(),duration:CONFIG.spinEvery,ease:"elastic.out(1,.5)",onComplete:shift})})();
// color drift (site-wide, gentle)
const H={v:0};let driftTween;
function setHue(){root.style.setProperty("--accent",`hsl(${(CONFIG.hue+H.v)%360} 80% 60%)`)}
function startDrift(){driftTween&&driftTween.kill();driftTween=gsap.to(H,{v:CONFIG.drift,duration:CONFIG.driftSpeed,ease:"sine.inOut",yoyo:true,repeat:-1,onUpdate:setHue})}
startDrift();setHue();
// tweak wiring
const bind=(id,fn)=>$(id).oninput=e=>fn(+e.target.value);
bind("#c_r",v=>root.style.setProperty("--radius",v+"px"));
bind("#c_g",v=>root.style.setProperty("--glow",v+"vmin"));
bind("#c_h",v=>{CONFIG.hue=v;setHue()});
bind("#c_d",v=>{CONFIG.drift=v;startDrift()});
bind("#c_s",v=>{CONFIG.driftSpeed=v;startDrift()});
bind("#c_t",v=>CONFIG.stagger=v/100);
</script></body></html>
