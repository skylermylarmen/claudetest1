<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">

<title>Fiamma pt 2 — reference board</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#121212;color:#fff;font-family:system-ui,sans-serif;padding:28px}

.m img,.m video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.n{padding:10px 12px;font-size:14px;font-weight:600}
.n span{color:#ff9a6b;margin-right:8px}
</style></head><body>
<h1>Fiamma pt 2 — reference board</h1>
